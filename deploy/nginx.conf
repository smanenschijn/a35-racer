server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    types {
        application/wasm wasm;
        application/octet-stream pck;
    }

    gzip on;
    gzip_types application/wasm application/octet-stream application/javascript text/css application/json;
    gzip_min_length 1024;

    # Cross-origin isolation (lets a threaded build use SharedArrayBuffer later on; harmless now).
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    location ~* \.(wasm|pck|js|png)$ {
        add_header Cache-Control "public, max-age=3600";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }
}
